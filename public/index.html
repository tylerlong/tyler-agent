<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typos Agent 演示</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    label { display: block; margin: 1rem 0; }
    input, textarea, button { box-sizing: border-box; display: block; width: 100%; padding: .6rem; font: inherit; }
    pre { padding: .8rem; background: #f3f3f3; white-space: pre-wrap; }
    #error { color: #a00000; }
  </style>
</head>
<body>
  <h1>Typos Agent 演示</h1>
  <p>目前只验证网页与本地服务之间的任务流程。</p>
  <form id="task">
    <label>目标文件夹（运行服务的电脑上的路径）<input name="folder" required></label>
    <label>Prompt<textarea name="prompt" required>找出这个文件夹里的 typos 并修正它们。</textarea></label>
    <button>提交</button>
  </form>
  <p id="error" role="alert"></p>
  <section id="result" hidden aria-live="polite">
    <h2 id="notice"></h2>
    <p>示例文件：<span id="filename"></span></p>
    <h3>修改前</h3><pre id="before"></pre>
    <h3>修改后</h3><pre id="after"></pre>
  </section>
  <script>
    document.querySelector('#task').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.querySelector('#error');
      const result = document.querySelector('#result');
      error.textContent = '';
      result.hidden = true;
      try {
        const response = await fetch('/api/demo', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '请求失败');
        document.querySelector('#notice').textContent = data.notice;
        document.querySelector('#filename').textContent = data.file;
        document.querySelector('#before').textContent = data.before;
        document.querySelector('#after').textContent = data.after;
        result.hidden = false;
      } catch (cause) {
        error.textContent = cause.message || '请求失败';
      }
    });
  </script>
</body>
</html>
