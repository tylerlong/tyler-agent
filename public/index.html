<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tyler Agent</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    label { display: block; margin: 1rem 0; }
    input, textarea, button { box-sizing: border-box; display: block; width: 100%; padding: .6rem; font: inherit; }
    fieldset { margin: 1rem 0; }
    fieldset label { display: inline-flex; align-items: center; gap: .4rem; margin: .3rem 1rem .3rem 0; }
    input[type="radio"] { display: inline; width: auto; }
    pre { padding: .8rem; background: #f3f3f3; white-space: pre-wrap; }
    #error { color: #a00000; }
  </style>
</head>
<body>
  <h1>Tyler Agent</h1>
  <p>输入 prompt，可在同一段共享对话中继续追问。目标文件夹目前只用于确认路径有效，不会读取或修改文件。</p>
  <fieldset id="debug" disabled>
    <legend>OpenRouter 调试日志（服务端 terminal）</legend>
    <label><input type="radio" name="debug" value="false">关闭</label>
    <label><input type="radio" name="debug" value="true">开启</label>
  </fieldset>
  <form id="task">
    <label>目标文件夹（运行服务的电脑上的路径）<input name="folder" required></label>
    <label>Prompt<textarea name="prompt" required></textarea></label>
    <button type="submit">提交</button>
  </form>
  <p id="error" role="alert"></p>
  <section aria-live="polite">
    <h2>对话</h2>
    <ol id="messages"></ol>
  </section>
  <script>
    const debug = document.querySelector('#debug');
    const error = document.querySelector('#error');
    const messages = document.querySelector('#messages');
    const loadChat = async () => {
      const response = await fetch('/api/chat');
      if (!response.ok) throw new Error('读取对话失败');
      const data = await response.json();
      messages.replaceChildren(...data.messages.map((message) => {
        const item = document.createElement('li');
        const label = document.createElement('strong');
        label.textContent = message.role === 'user' ? '你' : 'Agent';
        const content = document.createElement('pre');
        content.textContent = message.content;
        item.append(label, content);
        return item;
      }));
    };
    loadChat().catch(() => { error.textContent = '读取对话失败，请刷新页面重试'; });
    const showDebug = (enabled) => {
      debug.querySelector(`input[value="${enabled}"]`).checked = true;
    };
    fetch('/api/debug').then(async (response) => {
      if (!response.ok) throw new Error('读取日志设置失败');
      showDebug((await response.json()).enabled);
      debug.disabled = false;
    }).catch(() => { error.textContent = '读取日志设置失败，请刷新页面重试'; });
    debug.addEventListener('change', async (event) => {
      debug.disabled = true;
      error.textContent = '';
      try {
        const response = await fetch('/api/debug', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ enabled: event.target.value === 'true' }),
        });
        if (!response.ok) throw new Error('更新日志设置失败');
        showDebug((await response.json()).enabled);
        debug.disabled = false;
      } catch {
        error.textContent = '更新日志设置失败，正在读取服务状态';
        try {
          const current = await fetch('/api/debug');
          if (!current.ok) throw new Error('读取日志设置失败');
          showDebug((await current.json()).enabled);
          debug.disabled = false;
          error.textContent = '更新日志设置失败，请重试';
        } catch {
          debug.querySelectorAll('input').forEach((input) => { input.checked = false; });
          error.textContent = '无法确认日志设置，请刷新页面';
        }
      }
    });
    document.querySelector('#task').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      error.textContent = '';
      try {
        const response = await fetch('/api/task', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '请求失败');
        await loadChat();
        form.elements.prompt.value = '';
      } catch (cause) {
        error.textContent = cause.message || '请求失败';
      }
    });
  </script>
</body>
</html>
