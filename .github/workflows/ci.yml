name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  native:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sw_vers && uname -m && node --version
      - run: pnpm install --frozen-lockfile
      - name: Real pinned macOS backend acceptance (no platform skips)
        timeout-minutes: 5
        run: |
          set -o pipefail
          pnpm build
          node --test --test-timeout=60000 test/*.test.ts 2>&1 | tee backend-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-backend-results
          path: backend-tests.log
          retention-days: 7
